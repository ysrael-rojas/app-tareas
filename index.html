<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="App Tareas: gestiona tus tareas personales con persistencia local en el navegador."
    />
    <title>App Tareas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#task-form">Saltar al formulario</a>

    <header class="app-header">
      <h1 class="app-header__title">App Tareas</h1>
      <p class="app-header__subtitle">
        Gestiona tus tareas. Se guardan en este navegador.
      </p>
    </header>

    <main class="app-main">
      <form
        id="task-form"
        class="task-form"
        aria-label="Crear nueva tarea"
        novalidate
      >
        <div class="task-form__row">
          <label class="visually-hidden" for="task-title">Título de la tarea</label>
          <input
            id="task-title"
            name="title"
            type="text"
            class="task-form__input"
            placeholder="¿Qué necesitas hacer?"
            autocomplete="off"
            maxlength="200"
            required
            aria-describedby="task-form-error"
          />
          <button type="submit" class="task-form__submit">Agregar</button>
        </div>
        <p
          id="task-form-error"
          class="task-form__error"
          role="alert"
          hidden
        ></p>
      </form>

      <div
        class="filters"
        role="tablist"
        aria-label="Filtros de tareas"
      >
        <button
          type="button"
          role="tab"
          id="filter-tab-all"
          class="filters__tab is-active"
          data-filter="all"
          aria-selected="true"
          aria-controls="task-list-panel"
          tabindex="0"
        >
          Todas <span class="filters__count" data-counter="all">0</span>
        </button>
        <button
          type="button"
          role="tab"
          id="filter-tab-pending"
          class="filters__tab"
          data-filter="pending"
          aria-selected="false"
          aria-controls="task-list-panel"
          tabindex="-1"
        >
          Pendientes <span class="filters__count" data-counter="pending">0</span>
        </button>
        <button
          type="button"
          role="tab"
          id="filter-tab-completed"
          class="filters__tab"
          data-filter="completed"
          aria-selected="false"
          aria-controls="task-list-panel"
          tabindex="-1"
        >
          Completadas <span class="filters__count" data-counter="completed">0</span>
        </button>
      </div>

      <div
        id="task-list-panel"
        role="tabpanel"
        aria-labelledby="filter-tab-all"
        class="task-list-panel"
      >
        <ul id="task-list" class="task-list" aria-live="polite"></ul>

        <p id="empty-state" class="empty-state" hidden>
          No hay tareas. Crea la primera con el formulario de arriba.
        </p>
      </div>
    </main>

    <footer class="app-footer">
      <small>Datos guardados localmente en este navegador (localStorage).</small>
    </footer>

    <div
      id="app-announcer"
      class="visually-hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <script src="./app.js" type="module" defer></script>
  </body>
</html>
